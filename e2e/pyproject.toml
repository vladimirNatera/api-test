[project]
name = "checkout-api-e2e"
version = "0.1.0"
description = "Business journeys for the grocery checkout API"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.15,<3",
    "assertpy>=1.1,<2",
    "factory-boy>=3.3,<4",
    "pydantic>=2.12,<3",
    "pytest>=8.4,<10",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
required_plugins = ["allure-pytest"]
markers = [
    "e2e: business journeys through the running API and PostgreSQL",
    "accounts: customer registration and sign-in journeys",
    "checkout: catalogue, cart, and purchase journeys",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
